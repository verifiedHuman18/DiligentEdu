<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DiligentEdu 3D Intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden !important;
            background-color: #191310;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #EDE0DB;
            user-select: none;
        }
        #intro-viewport {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #231913 0%, #191310 65%, #0D0806 100%);
            opacity: 1;
            transform: scale(1);
            overflow: hidden !important;
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #intro-viewport.warp-exit {
            opacity: 0;
            transform: scale(1.08);
        }
        #canvas-3d {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .content-overlay {
            position: absolute;
            top: 66%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            pointer-events: none;
            animation: contentAppear 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
            opacity: 0;
        }
        @keyframes contentAppear {
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }
        .brand-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            text-shadow: 0 4px 28px rgba(251, 191, 36, 0.4);
            margin-bottom: 2px;
            line-height: 1.1;
        }
        .brand-accent {
            color: #FBBF24;
            background: linear-gradient(135deg, #FDE68A 0%, #FBBF24 50%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-tagline {
            font-size: 1.15rem;
            font-weight: 500;
            color: #D6C2B8;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        .prompt-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(45, 34, 27, 0.85);
            border: 1.5px solid rgba(251, 191, 36, 0.45);
            padding: 12px 32px;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.90rem;
            font-weight: 800;
            color: #FBBF24 !important;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.3);
            animation: pulsePrompt 2.0s infinite ease-in-out;
            pointer-events: auto !important;
            cursor: pointer !important;
            transition: all 0.2s ease;
            outline: none;
        }
        .prompt-badge:hover, .prompt-badge:active {
            background: rgba(251, 191, 36, 0.25);
            border-color: #FBBF24;
            color: #FBBF24 !important;
            transform: scale(1.05);
            box-shadow: 0 0 32px rgba(251, 191, 36, 0.6);
        }
        @keyframes pulsePrompt {
            0%, 100% {
                box-shadow: 0 0 16px rgba(251, 191, 36, 0.25);
                opacity: 0.92;
            }
            50% {
                box-shadow: 0 0 32px rgba(251, 191, 36, 0.6);
                opacity: 1.0;
            }
        }
        .skip-corner-btn {
            position: fixed;
            bottom: 24px;
            right: 28px;
            z-index: 20;
            background: transparent;
            border: none;
            color: #8C786E;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
            outline: none;
            padding: 8px 12px;
        }
        .skip-corner-btn:hover {
            color: #FBBF24;
            transform: translateX(2px);
        }
        @media (max-width: 768px) {
            .brand-title { font-size: 2.6rem; }
            .brand-tagline { font-size: 0.95rem; }
            .content-overlay { top: 70%; }
        }
        @media (prefers-reduced-motion: reduce) {
            #intro-viewport { transition: none; }
            .prompt-badge { animation: none; }
        }
    </style>
</head>
<body>
    <div id="intro-viewport">
        <canvas id="canvas-3d"></canvas>
        <div class="content-overlay">
            <div class="brand-title">Diligent<span class="brand-accent">Edu</span></div>
            <div class="brand-tagline">Academic Intelligence for Every Student</div>
            <button class="prompt-badge" id="js-enter-btn">
                ✦ PRESS ENTER TO BEGIN ✦
            </button>
        </div>
        <button class="skip-corner-btn" id="js-skip-btn">
            Skip intro ➔
        </button>
    </div>

    <script>
        let isReady = false;
        let hasCompleted = false;

        // Official Streamlit Custom Component protocol bridge (Phases 3-7, 30)
        const Streamlit = {
            setComponentValue: function(value) {
                window.parent.postMessage({
                    isStreamlitMessage: true,
                    type: "streamlit:setComponentValue",
                    value: value
                }, "*");
            },
            setFrameHeight: function(height) {
                if (!isReady) return;
                window.parent.postMessage({
                    isStreamlitMessage: true,
                    type: "streamlit:setFrameHeight",
                    height: height || window.innerHeight
                }, "*");
            },
            setComponentReady: function() {
                window.parent.postMessage({
                    isStreamlitMessage: true,
                    type: "streamlit:componentReady",
                    apiVersion: 1
                }, "*");
            }
        };

        // 1. Initial Handshake: Send componentReady FIRST (Phase 5, 29)
        window.addEventListener('DOMContentLoaded', () => {
            Streamlit.setComponentReady();
        });

        // 2. Listen for Streamlit's render confirmation message (Phase 29)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === "streamlit:render") {
                isReady = true;
                Streamlit.setFrameHeight(window.innerHeight);
            }
        });

        // 3. Unified completeIntro handler with idempotency guard (Phases 7, 10, 12, 24, 26)
        function completeIntro() {
            if (hasCompleted) return;
            hasCompleted = true;

            const viewport = document.getElementById('intro-viewport');
            if (viewport) {
                viewport.classList.add('warp-exit');
            }

            if (window.__triggerCoreWarp) {
                window.__triggerCoreWarp();
            }

            setTimeout(() => {
                Streamlit.setComponentValue("complete");
            }, 260);
        }

        // Keyboard Enter Listener (Phases 21, 22, 24)
        function handleKeyDown(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                completeIntro();
            }
        }

        window.addEventListener('keydown', handleKeyDown);

        // Center Enter Button Click (Phases 24, 25)
        const enterBtn = document.getElementById('js-enter-btn');
        if (enterBtn) {
            enterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                completeIntro();
            });
        }

        // Lower Corner Skip Button Click (Phases 24, 25)
        const skipBtn = document.getElementById('js-skip-btn');
        if (skipBtn) {
            skipBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                completeIntro();
            });
        }

        // Viewport Click Trigger
        document.getElementById('intro-viewport').addEventListener('click', (e) => {
            if (e.target.id === 'intro-viewport' || e.target.id === 'canvas-3d') {
                completeIntro();
            }
        });

        // Mobile touch label (Phase 35)
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            if (enterBtn) enterBtn.innerText = '✦ TAP TO BEGIN ✦';
        }

        // Procedural Three.js Knowledge Universe (Phases 6-20)
        try {
            const canvas = document.getElementById('canvas-3d');
            let width = window.innerWidth;
            let height = window.innerHeight;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 0, 22);

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Mouse coordinate tracking for Parallax (0 Streamlit server calls)
            const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
            window.addEventListener('mousemove', (e) => {
                mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            // Ambient & Point Lights
            const ambientLight = new THREE.AmbientLight(0xFFE8D6, 0.9);
            scene.add(ambientLight);

            const amberPointLight = new THREE.PointLight(0xFBBF24, 3.2, 65);
            amberPointLight.position.set(0, 1.2, 6);
            scene.add(amberPointLight);

            const tealPointLight = new THREE.PointLight(0x14B8A6, 2.2, 55);
            tealPointLight.position.set(-9, 7, 2);
            scene.add(tealPointLight);

            const purplePointLight = new THREE.PointLight(0xA855F7, 2.2, 55);
            purplePointLight.position.set(9, -5, 2);
            scene.add(purplePointLight);

            // Central Knowledge Core (Centered slightly above text at Y = 1.2)
            const coreGroup = new THREE.Group();
            coreGroup.position.set(0, 1.2, 0);
            scene.add(coreGroup);

            // Inner sphere
            const innerGeo = new THREE.SphereGeometry(2.4, 32, 32);
            const innerMat = new THREE.MeshPhongMaterial({
                color: 0xFBBF24,
                emissive: 0xB45309,
                emissiveIntensity: 0.65,
                shininess: 95,
                transparent: true,
                opacity: 0.88
            });
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            coreGroup.add(innerMesh);

            // Outer wireframe cage
            const cageGeo = new THREE.IcosahedronGeometry(3.6, 1);
            const cageMat = new THREE.MeshBasicMaterial({
                color: 0xFDE68A,
                wireframe: true,
                transparent: true,
                opacity: 0.45
            });
            const cageMesh = new THREE.Mesh(cageGeo, cageMat);
            coreGroup.add(cageMesh);

            // 3 Orbital Rings (Atomic / Concept Tracks centered at Y = 1.2)
            const ringsGroup = new THREE.Group();
            ringsGroup.position.set(0, 1.2, 0);
            scene.add(ringsGroup);

            const ringMaterials = [
                new THREE.MeshBasicMaterial({ color: 0xFBBF24, transparent: true, opacity: 0.65, side: THREE.DoubleSide }),
                new THREE.MeshBasicMaterial({ color: 0x14B8A6, transparent: true, opacity: 0.55, side: THREE.DoubleSide }),
                new THREE.MeshBasicMaterial({ color: 0xA855F7, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
            ];

            const rings = [];
            const ringRadii = [5.5, 7.2, 9.0];
            const ringRotations = [
                { x: Math.PI / 3, y: Math.PI / 6 },
                { x: -Math.PI / 4, y: Math.PI / 3 },
                { x: Math.PI / 2.2, y: -Math.PI / 5 }
            ];

            ringRadii.forEach((r, idx) => {
                const ringGeo = new THREE.RingGeometry(r - 0.04, r + 0.04, 64);
                const ringMesh = new THREE.Mesh(ringGeo, ringMaterials[idx]);
                ringMesh.rotation.x = ringRotations[idx].x;
                ringMesh.rotation.y = ringRotations[idx].y;
                ringsGroup.add(ringMesh);
                rings.push(ringMesh);
            });

            // Concept Satellites Orbiting on the Rings
            const satGroup = new THREE.Group();
            satGroup.position.set(0, 1.2, 0);
            scene.add(satGroup);

            // Science Concept (Octahedron)
            const satGeo1 = new THREE.OctahedronGeometry(0.55);
            const satMat1 = new THREE.MeshPhongMaterial({ color: 0xFBBF24, emissive: 0xF59E0B, emissiveIntensity: 0.85 });
            const sat1 = new THREE.Mesh(satGeo1, satMat1);

            // Math Concept (Dodecahedron)
            const satGeo2 = new THREE.DodecahedronGeometry(0.48);
            const satMat2 = new THREE.MeshPhongMaterial({ color: 0x14B8A6, emissive: 0x0D9488, emissiveIntensity: 0.85 });
            const sat2 = new THREE.Mesh(satGeo2, satMat2);

            // Learning Concept (Tetrahedron)
            const satGeo3 = new THREE.TetrahedronGeometry(0.55);
            const satMat3 = new THREE.MeshPhongMaterial({ color: 0xA855F7, emissive: 0x7E22CE, emissiveIntensity: 0.85 });
            const sat3 = new THREE.Mesh(satGeo3, satMat3);

            satGroup.add(sat1);
            satGroup.add(sat2);
            satGroup.add(sat3);

            // Knowledge Network Connecting Filaments
            const lineMat = new THREE.LineBasicMaterial({
                color: 0xFBBF24,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending
            });

            const lineGeo1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,1.2,0), new THREE.Vector3(0,1.2,0)]);
            const lineGeo2 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,1.2,0), new THREE.Vector3(0,1.2,0)]);
            const lineGeo3 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,1.2,0), new THREE.Vector3(0,1.2,0)]);

            const line1 = new THREE.Line(lineGeo1, lineMat);
            const line2 = new THREE.Line(lineGeo2, lineMat);
            const line3 = new THREE.Line(lineGeo3, lineMat);

            scene.add(line1);
            scene.add(line2);
            scene.add(line3);

            // Starfield Particles
            const particleCount = 280;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleColors = new Float32Array(particleCount * 3);

            const palette = [
                new THREE.Color(0xFBBF24),
                new THREE.Color(0x14B8A6),
                new THREE.Color(0xA855F7),
                new THREE.Color(0xF97316),
                new THREE.Color(0xFFFFFF)
            ];

            for (let i = 0; i < particleCount; i++) {
                particlePositions[i * 3] = (Math.random() - 0.5) * 52;
                particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 36;
                particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 42;

                const col = palette[Math.floor(Math.random() * palette.length)];
                particleColors[i * 3] = col.r;
                particleColors[i * 3 + 1] = col.g;
                particleColors[i * 3 + 2] = col.b;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.28,
                vertexColors: true,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // Resize handler
            window.addEventListener('resize', () => {
                width = window.innerWidth;
                height = window.innerHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
                Streamlit.setFrameHeight(height);
            });

            // Warp Exit Hook
            let isWarping = false;
            window.__triggerCoreWarp = function() {
                isWarping = true;
            };

            // Animation Loop (Damped Mouse Parallax)
            let clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const t = clock.getElapsedTime();

                // Smooth Damped Mouse Parallax
                mouse.x += (mouse.targetX - mouse.x) * 0.05;
                mouse.y += (mouse.targetY - mouse.y) * 0.05;

                // Camera Parallax
                camera.position.x = mouse.x * 2.0;
                camera.position.y = mouse.y * 1.6;
                camera.lookAt(0, 1.2, 0);

                // Multi-Depth Tiered Movement
                particles.position.x = -mouse.x * 1.5;
                particles.position.y = -mouse.y * 1.2;
                ringsGroup.position.x = mouse.x * 0.5;
                ringsGroup.position.y = 1.2 + mouse.y * 0.35;
                coreGroup.position.x = mouse.x * 0.25;
                coreGroup.position.y = 1.2 + mouse.y * 0.2;

                // Warp Pulse on Enter trigger
                if (isWarping) {
                    coreGroup.scale.multiplyScalar(1.05);
                    amberPointLight.intensity *= 1.08;
                    camera.position.z -= 0.6;
                } else {
                    // Knowledge Core Rotation & Pulse
                    coreGroup.rotation.y = t * 0.45;
                    coreGroup.rotation.x = Math.sin(t * 0.3) * 0.15;
                    const scalePulse = 1 + Math.sin(t * 2.5) * 0.035;
                    coreGroup.scale.set(scalePulse, scalePulse, scalePulse);
                }

                // Cage counter-rotation
                cageMesh.rotation.y = -t * 0.3;
                cageMesh.rotation.z = t * 0.2;

                // Orbital Rings Rotation
                rings[0].rotation.z = t * 0.35;
                rings[1].rotation.z = -t * 0.25;
                rings[2].rotation.z = t * 0.18;

                // Satellite Orbits
                const a1 = t * 0.9;
                sat1.position.set(Math.cos(a1) * 5.5, 1.2 + Math.sin(a1) * 5.5 * Math.cos(Math.PI/3), Math.sin(a1) * 5.5 * Math.sin(Math.PI/3));
                sat1.rotation.x = t * 1.5;
                sat1.rotation.y = t * 1.2;

                const a2 = -t * 0.75 + 1.2;
                sat2.position.set(Math.cos(a2) * 7.2, 1.2 + Math.sin(a2) * 7.2 * Math.cos(-Math.PI/4), Math.sin(a2) * 7.2 * Math.sin(-Math.PI/4));
                sat2.rotation.x = t * 1.2;
                sat2.rotation.z = t * 1.4;

                const a3 = t * 0.6 + 2.4;
                sat3.position.set(Math.cos(a3) * 9.0, 1.2 + Math.sin(a3) * 9.0 * Math.cos(Math.PI/2.2), Math.sin(a3) * 9.0 * Math.sin(Math.PI/2.2));
                sat3.rotation.y = t * 1.6;

                // Dynamic Knowledge Network Filaments
                const corePos = coreGroup.position;
                lineGeo1.setFromPoints([corePos, sat1.position]);
                lineGeo2.setFromPoints([corePos, sat2.position]);
                lineGeo3.setFromPoints([corePos, sat3.position]);

                // Starfield subtle cosmic drift
                particles.rotation.y = t * 0.04;
                particles.rotation.x = Math.sin(t * 0.05) * 0.04;

                renderer.render(scene, camera);
            }

            animate();

        } catch (err) {
            console.warn("WebGL initialization fallback note:", err);
        }
    </script>
</body>
</html>
