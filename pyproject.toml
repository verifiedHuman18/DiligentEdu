[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diligentedu"
version = "0.1.0"
description = "NCERT Academic Science RAG Assistant & Intelligent Tutor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "firebase-admin>=7.5.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.29",
    "langchain-huggingface>=0.3.1",
    "langchain-pinecone>=0.2.12",
    "openai>=1.100.0",
    "pinecone>=7.3.0",
    "plotly>=6.3.0",
    "prisma>=0.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "sentence-transformers>=5.1.0",
    "streamlit>=1.49.1",
    "torch>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "frontend*"]


[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "logs",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
]

[tool.ruff.lint.isort]
known-first-party = ["src", "backend", "adaptive_engine", "quiz_generator", "quiz_storage", "swat_analyzer", "teacher_engine", "frontend"]

[tool.pyright]
extraPaths = ["."]
